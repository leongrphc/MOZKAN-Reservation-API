name: mozkan
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mozkan
      POSTGRES_PASSWORD: mozkan_local
      POSTGRES_DB: mozkan
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mozkan -d mozkan']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ['node', 'dist/scripts/migrate.js']
    environment: &app_environment
      DATABASE_URL: postgresql://mozkan:mozkan_local@db:5432/mozkan
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting MOZKAN}
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    init: true
    environment: *app_environment
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 7s
      retries: 5
  worker:
    build: .
    init: true
    command: ['node', 'dist/src/worker.js']
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
