name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mozkan
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mozkan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mozkan -d mozkan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mozkan:ci_password@localhost:5432/mozkan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
